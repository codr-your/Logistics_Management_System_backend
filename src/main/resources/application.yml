server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/warehouse_manage?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.warehouse.backend_system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    logging:
      level:
        com.warehouse.backend_system.mapper: debug